[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["bellows"]
omit = [
    "bellows/cli/*.py",
    "bellows/typing.py",
]

[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING",
    "if typing.TYPE_CHECKING",
    "@(abc\\.)?abstractmethod",
]
