[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[project]
name = "bellows"
dynamic = ["version"]
description = "Library implementing EZSP"
urls = {repository = "https://github.com/zigpy/bellows"}
authors = [
    {name = "Russell Cloran", email = "rcloran@gmail.com"}
]
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "click",
    "click-log>=0.2.1",
    "voluptuous",
    "zigpy>=2.4.0",
    "serialx>=1.13.0"
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "tools", "tools.*"]

[tool.setuptools.package-data]
bellows = ["py.typed"]

[project.optional-dependencies]
testing = [
    "pytest>=7.1.2",
    "pytest-asyncio>=0.19.0",
    "pytest-timeout>=2.1.0",
    "pytest-mock>=3.8.2",
    "pytest-cov>=3.0.0",
]

[tool.setuptools-git-versioning]
enabled = true

[project.scripts]
bellows = "bellows.cli.main:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "C",  # complexity
    "D",  # docstrings
    "E",  # pycodestyle
    "F",  # pyflakes/autoflake
    "I",  # isort
    "ICN001", # import concentions; {name} should be imported as {asname}
    "PGH004",  # Use specific rule codes when using noqa
    "PLC0414", # Useless import alias. Import alias does not rename original package.
    "RUF006", # Store a reference to the return value of asyncio.create_task
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TRY004", # Prefer TypeError exception for invalid type
    "UP",  # pyupgrade
    "W",  # pycodestyle
]

ignore = [
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D106",   # Missing docstring in public nested class
    "D107",   # Missing docstring in `__init__`
    "D202",   # No blank lines allowed after function docstring
    "D203",   # 1 blank line required before class docstring
    "D205",   # 1 blank line required between summary line and description
    "D213",   # Multi-line docstring summary should start at the second line
    "D400",   # First line should end with a period
    "D401",   # First line of docstring should be in imperative mood:
    "D406",   # Section name should end with a newline
    "D407",   # Section name underlining
    "D415",   # First line should end with a period, question mark, or exclamation point
    "E501",   # line too long
              # the rules below this line should be corrected
    "PGH004", # Use specific rule codes when using `noqa`
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401", "F403"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.isort]
# will group `import x` and `from x import` of the same module.
force-sort-within-sections = true
known-first-party = [
    "bellows",
    "tests",
]
forced-separate = ["tests"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unreachable = true
show_error_codes = true
show_error_context = true
error_summary = true
exclude = ["^tests/"]
# zigpy's integer, enum and struct constructors are unannotated, making nearly
# every zigpy type construction an "untyped call". bellows.types holds only
# subclasses of those types, so it is excluded for the same reason. Calls to
# untyped functions anywhere else in bellows are still reported.
untyped_calls_exclude = ["zigpy", "bellows.types"]

# Per-module error-code suppressions below are regenerated by
# `python -m tools.regenerate_mypy_ignores`. They are sorted easiest-to-fix
# first; clean up a module's errors and re-run the tool to shrink the list.
# Autogenerated mypy overrides: start
# Total ignored errors: 283 across 28 modules
[[tool.mypy.overrides]]
module = "bellows.cli.dump"
disable_error_code = [
    "no-untyped-def",  # 1
]

